[package]
name = "desktop_terrarium"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"

[dependencies]
bevy = { version = "0.20", features = ["wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.10"
dirs = "7"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
